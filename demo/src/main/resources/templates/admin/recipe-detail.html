<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết công thức - Bún Bò Gia Truyền</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body><div class="admin-layout">
    <aside th:replace="~{fragments/layout :: admin_sidebar('recipes')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: admin_topbar('Chi tiết công thức', 'Tìm nguyên liệu...')}"></div>
        <a th:href="@{/admin/recipes}" style="display:inline-block;margin-bottom:1rem;color:var(--primary);font-weight:600;text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách công thức</a>
        <div th:if="${successMessage}" class="alert-warning-toast" style="margin-bottom:1rem;border-left-color:#27ae60;"><i class="fa-solid fa-circle-check" style="color:#27ae60;"></i><span th:text="${successMessage}"></span></div>
        <div th:if="${errorMessage}" class="alert-warning-toast" style="margin-bottom:1rem;border-left-color:#c0392b;"><i class="fa-solid fa-circle-exclamation" style="color:#c0392b;"></i><span th:text="${errorMessage}"></span></div>
        <section class="panel" style="margin-bottom:1.5rem;"><p style="margin:0;color:var(--text-light);">Món ăn</p><h1 style="margin:.25rem 0 .5rem;" th:text="${recipe.dish.name}">Món ăn</h1><div style="display:flex;gap:2rem;flex-wrap:wrap;"><span>Giá: <strong th:text="${#numbers.formatDecimal(recipe.dish.price, 1, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</strong></span><span>Chi nhánh: <strong th:text="${recipe.branch.name}">Chi nhánh</strong></span><span><strong th:text="${#lists.size(recipe.recipeItems)}">0</strong> nguyên liệu</span></div></section>
        <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:1.5rem;align-items:start;">
            <section class="panel" style="padding:0;overflow:hidden;"><div style="padding:1rem 1.5rem;border-bottom:1px solid var(--border-color);"><h3 style="margin:0;">Nguyên liệu cần dùng</h3></div><div class="admin-table" style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><thead><tr><th>Nguyên liệu</th><th>Định lượng</th><th>Đơn vị</th><th style="text-align:right;">Thao tác</th></tr></thead><tbody><tr th:each="item : ${recipe.recipeItems}"><td th:text="${item.inventoryItem.ingredientName}">Nguyên liệu</td><td th:text="${item.amount.stripTrailingZeros().toPlainString()}">0</td><td th:text="${item.inventoryItem.unit}">kg</td><td style="text-align:right;"><form th:action="@{/admin/recipes/{recipeId}/items/{itemId}/delete(recipeId=${recipe.id},itemId=${item.id})}" method="post" style="display:inline;"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" style="border:0;background:transparent;color:#c0392b;cursor:pointer;"><i class="fa-solid fa-trash"></i> Xóa</button></form></td></tr><tr th:if="${#lists.isEmpty(recipe.recipeItems)}"><td colspan="4" style="text-align:center;padding:2rem;color:var(--text-light);">Công thức chưa có nguyên liệu.</td></tr></tbody></table></div></section>
            <section class="panel"><h3 style="margin-top:0;"><i class="fa-solid fa-plus" style="color:var(--primary);"></i> Thêm nguyên liệu</h3><form th:action="@{/admin/recipes/{id}/items(id=${recipe.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="inventoryItemId">Nguyên liệu kho</label><select id="inventoryItemId" name="inventoryItemId" required style="width:100%;margin:.35rem 0 1rem;padding:.65rem;"><option value="">-- Chọn nguyên liệu --</option><option th:each="option : ${inventoryOptions}" th:value="${option.id}" th:disabled="${usedInventoryItemIds.contains(option.id)}" th:text="${option.ingredientName + ' (' + option.unit + ')' + (usedInventoryItemIds.contains(option.id) ? ' - đã có' : '')}">Nguyên liệu</option></select><label for="quantityRequired">Số lượng cho một phần</label><input id="quantityRequired" name="quantityRequired" type="number" min="0.001" step="0.001" required style="width:100%;box-sizing:border-box;margin:.35rem 0 1rem;padding:.65rem;"><button class="btn-primary" type="submit"><i class="fa-solid fa-plus"></i> Thêm vào công thức</button></form></section>
        </div>
    </main>
</div></body>
</html>
