<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công thức món - Bún Bò Gia Truyền</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body><div class="admin-layout">
    <aside th:replace="~{fragments/layout :: admin_sidebar('recipes')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: admin_topbar('Cấu hình công thức', 'Tìm món ăn...')}"></div>
        <div th:if="${successMessage}" class="alert-warning-toast" style="margin-bottom:1rem;border-left-color:#27ae60;"><i class="fa-solid fa-circle-check" style="color:#27ae60;"></i><span th:text="${successMessage}"></span></div>
        <div th:if="${errorMessage}" class="alert-warning-toast" style="margin-bottom:1rem;border-left-color:#c0392b;"><i class="fa-solid fa-circle-exclamation" style="color:#c0392b;"></i><span th:text="${errorMessage}"></span></div>
        <section class="panel" style="padding:0;overflow:hidden;">
            <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;"><div><h2 style="margin:0;">Công thức theo món</h2><p style="margin:.35rem 0 0;color:var(--text-light);">Mỗi công thức chỉ sử dụng nguyên liệu của chi nhánh hiện tại.</p></div><a class="btn-secondary" th:href="@{/admin/inventory}" style="text-decoration:none;"><i class="fa-solid fa-warehouse"></i> Xem kho</a></div>
            <div class="admin-table" style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;"><thead><tr><th>Món ăn</th><th>Chi nhánh</th><th>Số nguyên liệu</th><th>Trạng thái</th><th style="text-align:right;">Thao tác</th></tr></thead><tbody>
                <tr th:each="dish : ${dishes}" th:with="recipe=${recipeByDish[dish.id]}">
                    <td><strong th:text="${dish.name}">Món ăn</strong><div style="font-size:.85rem;color:var(--text-light);" th:text="${#numbers.formatDecimal(dish.price, 1, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div></td>
                    <td th:text="${dish.branch != null ? dish.branch.name : '-'}">Chi nhánh</td>
                    <td th:text="${recipe != null ? #lists.size(recipe.recipeItems) : 0}">0</td>
                    <td><span th:if="${recipe == null}" class="status-badge" style="background:#f1f3f5;color:#54606e;">Chưa cấu hình</span><span th:if="${recipe != null and #lists.isEmpty(recipe.recipeItems)}" class="status-badge" style="background:#fff3cd;color:#a66c00;">Thiếu nguyên liệu</span><span th:if="${recipe != null and !#lists.isEmpty(recipe.recipeItems)}" class="status-badge" style="background:#e8f8f0;color:#1e8449;">Đã cấu hình</span></td>
                    <td style="text-align:right;"><a th:if="${recipe != null}" th:href="@{/admin/recipes/dish/{id}(id=${dish.id})}" class="btn-secondary" style="text-decoration:none;padding:.45rem .7rem;"><i class="fa-solid fa-pen"></i> Xem / chỉnh</a><form th:if="${recipe == null}" th:action="@{/admin/recipes/dish/{id}(id=${dish.id})}" method="post" style="display:inline;"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="dishId" th:value="${dish.id}"><button class="btn-primary" type="submit" style="padding:.45rem .7rem;">Tạo công thức</button></form></td>
                </tr>
                <tr th:if="${#lists.isEmpty(dishes)}"><td colspan="5" style="text-align:center;padding:2rem;">Chưa có món ăn cho chi nhánh này.</td></tr>
            </tbody></table></div>
        </section>
    </main>
</div></body>
</html>
