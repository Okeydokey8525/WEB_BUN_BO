<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý kho - Bún Bò Gia Truyền</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/layout :: admin_sidebar('inventory')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: admin_topbar('Quản lý kho nguyên liệu', 'Tìm nguyên liệu...')}"></div>

        <div class="alert-warning-toast" th:if="${lowStockCount > 0}" style="margin-bottom: 1.25rem;">
            <i class="fa-solid fa-triangle-exclamation" style="color:var(--warning); font-size:1.4rem;"></i>
            <div><strong>Cần theo dõi tồn kho.</strong> Có <span th:text="${lowStockCount}">0</span> nguyên liệu sắp hết hoặc đã hết.</div>
        </div>
        <div th:if="${successMessage}" class="alert-warning-toast" style="margin-bottom: 1.25rem; border-left-color:#27ae60;">
            <i class="fa-solid fa-circle-check" style="color:#27ae60; font-size:1.4rem;"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <section class="panel" style="padding:0; overflow:hidden;">
            <div style="padding:1.25rem 1.5rem; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;">
                <div>
                    <h2 style="margin:0; color:var(--text-dark);">Tồn kho hiện tại</h2>
                    <p style="margin:.35rem 0 0; color:var(--text-light);" th:text="${currentBranch != null ? currentBranch.name : 'Chi nhánh hiện tại'}">Chi nhánh hiện tại</p>
                </div>
                <a class="btn-secondary" th:href="@{/admin/recipes}" style="text-decoration:none;"><i class="fa-solid fa-book-open"></i> Quản lý công thức</a>
            </div>
            <div class="admin-table" style="overflow-x:auto;">
                <table style="width:100%; border-collapse:collapse;">
                    <thead><tr>
                        <th>Nguyên liệu</th><th>Số lượng</th><th>Đơn vị</th><th>Mức tối thiểu</th><th>Trạng thái</th><th>Chi nhánh</th><th style="text-align:right;">Thao tác</th>
                    </tr></thead>
                    <tbody>
                    <tr th:each="item : ${inventoryItems}">
                        <td><strong th:text="${item.ingredientName}">Nguyên liệu</strong></td>
                        <td th:text="${item.quantity.stripTrailingZeros().toPlainString()}">0</td>
                        <td th:text="${item.unit}">kg</td>
                        <td th:text="${item.minThreshold.stripTrailingZeros().toPlainString()}">0</td>
                        <td>
                            <span th:if="${item.quantity.signum() == 0}" class="status-badge" style="background:#fdecea; color:#c0392b;">Hết hàng</span>
                            <span th:if="${item.quantity.signum() > 0 and item.quantity.compareTo(item.minThreshold) <= 0}" class="status-badge" style="background:#fff3cd; color:#a66c00;">Sắp hết</span>
                            <span th:if="${item.quantity.compareTo(item.minThreshold) > 0}" class="status-badge" style="background:#e8f8f0; color:#1e8449;">Đủ hàng</span>
                        </td>
                        <td th:text="${item.branch != null ? item.branch.name : '-'}">Chi nhánh</td>
                        <td style="text-align:right; white-space:nowrap;">
                            <a th:href="@{/admin/inventory/{id}(id=${item.id})}" class="btn-secondary" style="text-decoration:none; padding:.45rem .7rem;"><i class="fa-solid fa-eye"></i> Chi tiết</a>
                            <a th:href="@{/admin/inventory/{id}/transactions(id=${item.id})}" class="btn-secondary" style="text-decoration:none; padding:.45rem .7rem; margin-left:.35rem;"><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(inventoryItems)}"><td colspan="7" style="text-align:center; padding:2rem; color:var(--text-light);">Chưa có nguyên liệu cho chi nhánh này.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
