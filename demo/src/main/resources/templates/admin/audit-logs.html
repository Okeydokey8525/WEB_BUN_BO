<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Nhật ký hoạt động')}"></head><body><div class="admin-layout"><aside th:replace="~{fragments/layout :: admin_sidebar('audit')}"></aside><main class="admin-content audit-page"><div th:replace="~{fragments/layout :: admin_topbar('Nhật ký hoạt động', 'Tìm nhật ký...')}"></div><header class="admin-page-header"><div class="admin-page-heading"><span class="admin-page-icon"><i class="fa-solid fa-clipboard-list"></i></span><div><h1>Nhật ký hoạt động</h1><p>Theo dõi các thao tác quan trọng trong hệ thống.</p></div></div></header><section class="report-kpi-grid audit-summary"><article class="report-kpi-card"><i class="fa-solid fa-list"></i><span>Tổng bản ghi</span><strong id="audit-total">—</strong></article><article class="report-kpi-card"><i class="fa-solid fa-code-branch"></i><span>Chi nhánh</span><strong id="audit-branch">—</strong></article></section><form id="audit-filter" class="admin-filter-card"><div class="admin-filter-grid"><label for="action">Hành động<input id="action" placeholder="Ví dụ: PAY_ORDER"></label><label for="username">Tên đăng nhập<input id="username" placeholder="Người thao tác"></label></div><div class="admin-filter-actions"><button class="btn-primary" type="submit"><i class="fa-solid fa-filter"></i> Áp dụng</button><button class="btn-secondary" type="reset"><i class="fa-solid fa-rotate-left"></i> Đặt lại</button></div><p id="audit-error" class="error-state" aria-live="polite" hidden></p></form><section class="admin-data-card"><div class="admin-card-header"><div><h2>Lịch sử thao tác</h2><p>Dữ liệu được lọc theo branch hiện hành.</p></div><span id="audit-page-info" class="page-info"></span></div><div class="admin-table-wrapper"><table class="admin-table"><caption class="visually-hidden">Audit log</caption><thead><tr><th>Thời gian</th><th>Người dùng</th><th>Hành động</th><th>Đối tượng</th><th>Chi nhánh</th><th>Metadata</th></tr></thead><tbody id="audit-body"></tbody></table></div><div class="pagination"><button id="audit-prev" class="btn-secondary" type="button">Trước</button><button id="audit-next" class="btn-secondary" type="button">Sau</button></div></section></main></div><script src="/js/admin-audit-logs.js"></script></body></html>
